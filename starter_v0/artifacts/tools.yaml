# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin cần thiết (như thiếu tên tài khoản mạng xã hội, thiếu link URL bài viết), hoặc hỏi xin xác nhận trước khi gửi tin nhắn."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cần hỏi người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời mong đợi: text (văn bản), yes_no (xác nhận có/không), choice (lựa chọn)"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn nếu response_type là choice"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một người dùng Twitter/X cụ thể. Dùng khi câu hỏi hỏi về bài đăng CỦA một người (Sam Altman, Elon Musk...)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle tài khoản Twitter/X (bỏ ký tự @, ví dụ: sama, elonmusk)"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm bài đăng/tweet trên mạng xã hội Twitter/X theo từ khóa hoặc chủ đề thảo luận chung (không phải trang cá nhân của một người)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm trên mạng xã hội"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp bài viết: Latest (mới nhất), Top (nổi bật nhất)"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin hoặc tin tức trên internet qua công cụ tìm kiếm web. Tham số query chỉ chứa từ khóa chủ đề (không chèn từ 'news' hay 'tin tức' vào query). Dùng topic='news' khi tìm tin tức."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm chủ đề (ví dụ: 'AI', 'bán dẫn'). Không chèn từ 'news' hay mốc thời gian vào đây"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: 'news' cho tin tức thời sự/báo chí, 'general' cho tra cứu kiến thức chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay/24h, 'week' cho tuần này, 'month' cho tháng này"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Lấy và đọc toàn bộ nội dung văn bản markdown từ một địa chỉ URL cụ thể do người dùng cung cấp."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ đường link URL đầy đủ cần đọc"}
      required: [url]

  - name: format
    description: "Trình bày các item dữ liệu đã thu thập được thành văn bản markdown digest theo mẫu."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề bản tin"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi bản tin lên kênh Telegram. CHỈ ĐƯỢC DÙNG khi người dùng đã xác nhận rõ ràng (confirmed=true). Tuyệt đối không dùng khi chưa có xác nhận từ người dùng."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản cần gửi"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận từ người dùng (bắt buộc true mới được gửi)"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: calculate_stats
    description: "Tính toán các chỉ số thống kê (tổng, trung bình, min, max, tỷ lệ phần trăm tăng trưởng) từ danh sách các con số nghiên cứu."
    parameters:
      type: object
      properties:
        numbers:
          type: array
          items: {type: number}
          description: "Danh sách các số cần tính toán"
        operation:
          type: string
          enum: [summary, average, sum, growth_rate]
          default: "summary"
          description: "Phép tính cần thực hiện: summary (tổng hợp), average (trung bình), sum (tổng), growth_rate (tỷ lệ tăng trưởng %)"
      required: [numbers]
